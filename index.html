<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f4f0e7">
<title>HSK Master Pro ✨</title>

<!-- Nhúng trực tiếp các file .js dữ liệu rời -->
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script src="hsk4.js"></script>
<script src="hsk5.js"></script>
<script src="hsk6.js"></script>

<style>
:root{--bg:#f4f0e7;--card:#fffdf7;--ink:#252525;--muted:#77746d;--red:#c94737;--line:#e3dccd;--blue:#427eae;--green:#2e7d32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:820px;margin:auto;min-height:100vh;padding:16px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--red);color:white;font-size:21px;font-weight:800}
h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:white}

.mode-tabs{display:flex;gap:4px;margin-bottom:12px;background:#eadecd;padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.mode-tabs::-webkit-scrollbar{display:none}
.mode-tab{flex:0 0 auto;border:none;background:transparent;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--muted);text-align:center;font-size:13px}
.mode-tab.active{background:var(--card);color:var(--red);box-shadow:0 2px 8px #0000000a}

.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.toolbar label{font-size:11px;color:var(--muted);display:block;margin:0 0 4px 2px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline-color:var(--blue);font-size:14px}
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:12px 2px 8px}
.track{height:6px;background:#e3dccd;border-radius:10px;overflow:hidden;margin-bottom:14px}.fill{height:100%;width:0;background:var(--red);transition:width .2s}

.card-box{background:var(--card);border:1px solid #e2dac8;border-radius:20px;padding:22px 16px 18px;text-align:center;box-shadow:0 5px 18px #55442b0c;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#f1ece1;padding:4px 8px;border-radius:20px;margin-bottom:14px}
.hanzi{font-size:clamp(44px,11vw,64px);font-weight:650;line-height:1.15;margin:0 0 8px;cursor:pointer}
.pinyin{font-size:21px;color:var(--red);margin:0 0 6px}.meaning{font-size:17px;margin:0 0 16px}
.example{border-top:1px solid var(--line);padding-top:14px;width:100%;max-width:520px}
.example-cn{font-size:clamp(18px,4vw,24px);line-height:1.45;margin-bottom:4px}.example-py{color:var(--red);font-size:13px;margin-bottom:4px}.example-vi{font-size:13px;color:#5c5851}

.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.smallbtn{border:1px solid #d8e0e4;color:var(--blue);background:transparent;border-radius:24px;padding:10px 14px;font-size:14px}
.smallbtn.unknown{color:#6c6559;border-color:var(--line)}.smallbtn.unknown.marked{background:#fff0d8;color:#8b5c10;border-color:#e9c98e}

/* Khung Note cá nhân */
.note-box{width:100%;max-width:520px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:left}
.note-box label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.note-input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;color:var(--ink);outline-color:var(--blue)}

/* Modal Tra nét chữ */
.modal{display:none;position:fixed;z-index:1000;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
.modal-content{background:var(--card);padding:20px;border-radius:20px;width:90%;max-width:340px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.close-modal{float:right;font-size:22px;font-weight:bold;cursor:pointer;color:var(--muted)}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.nav .btn{font-size:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.stat{background:#eee8dc;border-radius:12px;padding:10px 6px;text-align:center}.stat strong{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}

.quiz-options{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:540px;margin-top:12px}
.quiz-btn{background:var(--card);border:1px solid var(--line);padding:15px;border-radius:14px;font-size:17px;text-align:center;cursor:pointer;transition:.2s;font-weight:500}
.quiz-btn:hover{background:#f1ece1;border-color:var(--blue)}
.quiz-btn.correct{background:#e8f5e9!important;border-color:var(--green)!important;color:var(--green);font-weight:bold}
.quiz-btn.wrong{background:#ffebee!important;border-color:var(--red)!important;color:var(--red);font-weight:bold}

.puzzle-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.p-chip{background:#e5dfd3;border:1px solid var(--line);padding:10px 14px;border-radius:12px;cursor:pointer;font-size:20px;font-weight:600}
.p-chip.selected{background:#ccc;color:#888;border-color:#bbb;pointer-events:none}

footer{text-align:center;color:var(--muted);font-size:11px;margin:16px 0 0}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">中</div>
    <div><h1>HSK Master Pro</h1><div class="sub">Flashcard & Stroke Order & Notes</div></div>
  </div>
  <button class="btn" id="resetBtn" title="Làm mới">↻ Làm mới</button>
</header>

<div class="mode-tabs">
  <button class="mode-tab active" data-mode="flashcard">📖 Flashcard</button>
  <button class="mode-tab" data-mode="quiz">❓ Trắc nghiệm</button>
  <button class="mode-tab" data-mode="puzzle">🧩 Ghép câu</button>
  <button class="mode-tab" data-mode="fix">🛠️ Sửa câu sai</button>
  <button class="mode-tab" data-mode="synonym">🔗 Đồng nghĩa</button>
</div>

<div class="toolbar" id="filterToolbar">
  <div>
    <label for="category">Cấp độ HSK</label>
    <select id="category">
      <option value="all">Tất cả (HSK 1 - 6)</option>
      <option value="HSK 1">HSK 1</option>
      <option value="HSK 2">HSK 2</option>
      <option value="HSK 3">HSK 3</option>
      <option value="HSK 4">HSK 4</option>
      <option value="HSK 5">HSK 5</option>
      <option value="HSK 6">HSK 6</option>
      <option value="marked">Từ chưa thuộc ⭐</option>
    </select>
  </div>
  <div>
    <label for="search">Tìm từ /
